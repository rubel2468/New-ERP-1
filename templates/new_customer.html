<!doctype html>
<html lang="en">
<head><title>New Customer</title></head>
<body>
<h1>Create New Customer</h1>
<form method="post">
    Name: <input type="text" name="name" required><br>
    Type: <select name="type"><option value="cash">Cash</option><option value="credit">Credit</option></select><br>
    Amount Due: <input type="number" step="0.01" name="amount" required><br>
    <button type="submit">Create</button>
</form>
</body>
</html>
